name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  # ── Job 1: lint (fast — blocks everything else if it fails) ──────────────────
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev tools
        run: pip install ruff mypy

      - run: ruff check .
      - run: ruff format --check .
      - run: mypy chem_engine/ --ignore-missing-imports

  # ── Job 2: build Rust extension + run tests ──────────────────────────────────
  test:
    name: Build & test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install maturin and dev dependencies
        run: pip install maturin pytest pytest-cov pytest-xdist

      - name: Build Rust extension (in-place)
        run: maturin develop --release

      - name: Run tests in parallel with coverage
        run: >
          pytest tests/
          -n auto
          --tb=short
          -q
          --cov=chem_engine
          --cov-report=term-missing
          --cov-fail-under=80
          --ignore=tests/test_correctness_vs_rdkit.py

  # ── Job 3: RDKit cross-validation (optional, runs on main only) ──────────────
  rdkit-validation:
    name: RDKit cross-validation
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install maturin, RDKit and test deps
        run: pip install maturin rdkit pytest pytest-xdist

      - name: Build Rust extension
        run: maturin develop --release

      - name: Run RDKit cross-validation tests
        run: pytest tests/test_correctness_vs_rdkit.py --tb=short -q

